[project]
name = "lote"
version = "0.1.0"
description = "Turns reference art into a consistent, wired 2D game kit."
requires-python = "==3.13.*"
# Pinned to the versions verified in ARCHITECTURE.md > Capability Check (2026-10-28).
dependencies = [
    "fastapi==0.162.0",
    "python-multipart==0.0.32",
    "pydantic==2.14.1",
    "openai==3.40.0",
    "meta-sam-parser==0.1.0",
    "pillow==13.0.0",
    "numpy==2.5.4",
    "playwright==1.64.1",
    "modal==1.6.3",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "python-dotenv==1.2.4",  # modal secret create --from-dotenv
    "ruff==0.17.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
